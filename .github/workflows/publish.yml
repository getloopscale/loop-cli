name: publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Run only hermetic suites (unit + contract). Integration tests in
      # tests/integration/ require a live theo backend (real auth + real
      # /api/v1 surface) which the publish runner does not have — they pass
      # locally against a live engine but fail on CI with exit-code 4 (auth).
      # Sprint 4 split (per READY_TO_READ_TEAM mandate 2026-06-25): unit +
      # contract suites cover the actual code (1303 PASS locally / 1294 PASS
      # on CI today); integration tests are operator-run + canonical-locally.
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
