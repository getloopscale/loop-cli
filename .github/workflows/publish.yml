name: publish
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No dependency cache: a release builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Refuse a tag that does not name the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
      # Trusted publishing (OIDC, no token): npm exchanges this job's id-token for a
      # short-lived publish credential and attaches provenance. It needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run build
      # Only the hermetic suites. tests/integration/ needs a live LoopScale API and a
      # signed-in user, which this runner does not have.
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm publish --access public
